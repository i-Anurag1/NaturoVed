name: CI

# Runs on every push/PR to main and develop (see docs/team_and_workflow.md
# for the branching strategy this supports).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (opencv runtime libs)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (v1 + v2 test suites)
        run: pytest tests/ -v
        env:
          # CI runs with NO trained model artifacts present — this is
          # intentional and exercises the documented fallback-heuristic
          # / rule-based code paths (see README.md "Honesty Notes").
          # The test suite is specifically designed to pass in both
          # states (trained models present or absent).
          APP_ENV: test

  frontend-build:
    name: Frontend Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:8000

      - name: Verify build output exists
        run: test -f build/index.html && test -d build/static

  severity-and-fusion-experiments:
    name: Run Documented ML Experiments (smoke test)
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Train field-context Random Forest (fast, synthetic domain-rule data)
        run: python -m app.ml.train_field_model --n_samples 2000 --out ./storage/models/field_model.joblib

      - name: Run leaf-segmentation comparison experiment
        run: python -m app.ml.evaluate_severity_segmentation --n_images 30

      - name: Generate tiny synthetic image benchmark (for CI smoke test only — NOT real disease data)
        run: python -m app.ml.synthetic_benchmark --output_dir ../data/synthetic_benchmark --images_per_class 5

      - name: Train tiny image model (random-init weights, CI has no ImageNet network access)
        run: |
          python -m app.ml.train_transfer --data_dir ../data/synthetic_benchmark --weights none \
            --epochs 1 --fine_tune_epochs 1 --out ./storage/models/disease_model.keras

      - name: Verify Grad-CAM code path runs without error (correctness only, not accuracy)
        run: |
          python -c "
          from app.services import image_model
          assert image_model.is_model_loaded(), 'model failed to load in CI'
          print('Grad-CAM smoke test: model loaded OK, code path importable.')
          "
