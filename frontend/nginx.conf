server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (BrowserRouter) — any path
    # that isn't a real static file must fall back to index.html, or
    # deep links like /result/5 or /dashboard will 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed static assets (CRA fingerprints
    # filenames, so long-lived caching is safe here).
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
